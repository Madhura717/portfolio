<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Madhura MS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: compact sticky nav, two-column hero (photo + text) with a faint blue ellipse,
   then full-width bands that alternate between two dark surfaces. Cards sit on each band.
   Motion is restrained: a short fade-up when the page loads, and small hover lifts. Nothing is tied to scrolling. */
:root {
  --bg: #080b12;
  --surface: #101521;
  --surface-2: #151c2a;
  --surface-3: #1b2535;
  --fg: #f3f6fb;
  --muted: #8e9aaf;
  --accent: #6ea8ff;
  --accent-2: #9fc4ff;
  --coral: #ff8c78;
  --green: #78d9a1;
  --line: rgba(255,255,255,.08);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius: 16px;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 1rem; line-height: 1.65;
  margin: 0; padding-inline: 1rem; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.eyebrow { font-size: .76rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--accent-2); }

/* nav */
header.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 70; margin-inline: -1rem; padding: .6rem 1rem;
  background: rgba(8,11,18,.96); border-bottom: 1px solid var(--line);
}
.nav-in { max-width: 1120px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; text-decoration: none; }
.brand span { color: var(--accent); }
nav.links { display: flex; gap: .1rem; min-width: 0; }
nav.links a { text-decoration: none; font-size: .82rem; font-weight: 500; color: var(--muted); padding: .4rem .75rem; border-radius: 99px; white-space: nowrap; transition: color .2s, background .2s; }
nav.links a:hover { color: var(--fg); }
nav.links a.on { color: var(--fg); background: var(--surface-3); }
@media (max-width: 860px) {
  .nav-in { flex-wrap: wrap; row-gap: .4rem; }
  nav.links { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; }
  html { scroll-padding-top: 6.6rem; }
}

/* hero */
.hero { position: relative; overflow: hidden; margin-inline: -1rem; padding: 4.5rem 1rem 5rem; isolation: isolate; }
.glow {
  position: absolute; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(900px circle at 82% 8%, rgba(54,92,190,.22), transparent 60%), radial-gradient(600px circle at 20% 60%, rgba(110,168,255,.07), transparent 60%);
}
.orbit {
  position: absolute; z-index: -1; width: min(1100px, 130vw); height: min(560px, 70vw); left: 50%; top: 52%;
  margin: calc(min(560px, 70vw) / -2) 0 0 calc(min(1100px, 130vw) / -2);
  border-radius: 50%; border: 1px solid rgba(110,168,255,.24); background: radial-gradient(closest-side, rgba(110,168,255,.05), transparent);
  transform: rotate(-9deg); animation: sway 18s ease-in-out infinite; will-change: transform; pointer-events: none;
}
.orbit::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); left: 14.6%; top: 14.6%; margin: -4px 0 0 -4px; animation: beacon 3s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(9deg); } }
@keyframes beacon { 50% { opacity: .35; } }
.hero.paused .orbit, .hero.paused .orbit::after { animation-play-state: paused; }
.hero-grid { display: grid; grid-template-columns: 1fr; gap: 2.2rem; align-items: center; justify-items: start; }
@media (min-width: 820px) { .hero-grid { grid-template-columns: auto 1fr; gap: 4rem; } }
.avatar {
  width: clamp(150px, 22vw, 200px); aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: var(--surface-3);
  border: 2px solid rgba(110,168,255,.7);
  box-shadow: 0 0 0 12px rgba(21,28,42,.9), 0 0 0 13px rgba(110,168,255,.16), 0 28px 70px -24px rgba(66,110,220,.7);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.hero h1 { font-size: clamp(2.6rem, 7vw, 4.2rem); font-weight: 800; letter-spacing: -0.04em; margin-top: .6rem; }
#headline { font-size: 1.05rem; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--accent-2); }
.quote { margin-top: 1rem; font-size: 1.15rem; color: var(--muted); }
.cta { margin-top: 1.8rem; display: flex; gap: .8rem; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: .55rem; padding: .8rem 1.35rem; border-radius: 12px; text-decoration: none;
  font: inherit; font-weight: 600; font-size: .94rem; border: 1px solid var(--surface-3); background: var(--surface-2); color: var(--fg); cursor: pointer;
  transition: transform .2s var(--ease), border-color .2s, background .2s;
}
.btn.primary { background: var(--accent); color: #07101f; border-color: var(--accent); }
.btn:hover { transform: translateY(-2px); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn:not(.primary):hover { border-color: var(--accent); }
.socials { margin-top: 1.4rem; display: flex; gap: .6rem; }
.ico { width: 2.6rem; height: 2.6rem; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--surface-3); color: var(--fg); transition: transform .2s var(--ease), border-color .2s, color .2s; }
a.ico:hover { transform: translateY(-3px); border-color: var(--accent); color: var(--accent-2); }
.ico svg { width: 1.15rem; height: 1.15rem; }
.ico:not([href]) { opacity: .45; cursor: not-allowed; }

/* bands: odd sit on --bg, even on --surface, and cards pick a surface that stands out from the band */
.band { margin-inline: -1rem; padding: 5rem 1rem; border-top: 1px solid var(--line); --card: var(--surface); --chip: var(--surface-2); }
.band:nth-of-type(even) { background: var(--surface); --card: var(--surface-2); --chip: var(--surface-3); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.2rem 2rem; flex-wrap: wrap; margin-bottom: 2.4rem; }
.sec-head h2 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; margin-top: .7rem; }
.sec-head > div { min-width: 0; }
.sec-head p { color: var(--muted); font-size: .95rem; max-width: 34ch; text-align: right; }
@media (max-width: 640px) { .sec-head p { text-align: left; } }

/* about */
.about { display: grid; grid-template-columns: 1fr; gap: 2.2rem; align-items: start; }
@media (min-width: 760px) { .about { grid-template-columns: 224px 1fr; gap: 3.4rem; } }
.photo { width: 224px; max-width: 100%; aspect-ratio: 1; border-radius: 20px; border: 1px solid var(--surface-3); object-fit: cover; object-position: 50% 25%; display: block; }
.about p { font-size: 1.2rem; line-height: 1.8; color: #cdd7e8; max-width: 62ch; }

/* skills */
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
.skill { padding: 1.5rem; min-width: 0; transition: border-color .2s, transform .2s var(--ease); }
.skill:hover { border-color: rgba(110,168,255,.45); transform: translateY(-3px); }
.skill h3 { font-size: 1rem; color: var(--accent); margin-bottom: 1.1rem; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { font-size: .8rem; padding: .3rem .75rem; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); color: #cdd7e8; }

/* projects */
.projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1.4rem; align-items: stretch; }
.project { overflow: hidden; display: flex; flex-direction: column; min-width: 0; transition: transform .25s var(--ease), border-color .2s, box-shadow .25s; }
.project:hover { transform: translateY(-6px); border-color: rgba(110,168,255,.5); box-shadow: 0 24px 50px -32px rgba(66,110,220,.8); }
.shot { aspect-ratio: 19/10; overflow: hidden; background: var(--surface-3); border-bottom: 1px solid var(--line); }
.shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.p-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; flex: 1; min-width: 0; }
.p-body h3 { font-size: 1.6rem; }
.p-body p, .p-body li { color: var(--muted); font-size: 1rem; line-height: 1.7; }
.p-body ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; }
.p-link { margin-top: auto; align-self: flex-start; display: inline-flex; gap: .5rem; align-items: center; font-weight: 600; font-size: .92rem; color: var(--accent); text-decoration: none; }
.p-link:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 4px; }
.p-link:not([href]) { color: var(--muted); cursor: default; }
.p-link svg { width: 1rem; height: 1rem; }

/* experience, education, achievements */
.stack { display: grid; gap: 1rem; }
.exp { padding: 1.7rem; display: grid; grid-template-columns: 1fr; gap: .8rem 2rem; transition: border-color .2s, transform .2s var(--ease); }
@media (min-width: 760px) { .exp { grid-template-columns: 190px 1fr; } }
.exp:hover, .edu:hover, .ach:hover { border-color: rgba(110,168,255,.45); transform: translateY(-2px); }
.when { color: var(--accent); font-weight: 600; font-size: .9rem; }
.exp h3 { font-size: 1.35rem; }
.org { color: var(--coral); font-weight: 600; font-size: .95rem; margin-top: .2rem; }
.exp ul { margin: .9rem 0 0; padding-left: 1.1rem; display: grid; gap: .35rem; color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 1rem; }
.edu, .ach { padding: 1.6rem; display: grid; gap: .35rem; align-content: start; transition: border-color .2s, transform .2s var(--ease); min-width: 0; }
.edu h3 { font-size: 1.25rem; margin-top: .2rem; }
.edu p, .ach p { color: var(--muted); }
.ach-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.pill { font-size: .8rem; font-weight: 700; color: var(--coral); border: 1px solid rgba(255,140,120,.45); background: rgba(255,140,120,.08); padding: .25rem .7rem; border-radius: 10px; white-space: nowrap; }
.ach h3 { font-size: 1.35rem; margin-top: .3rem; }

/* contact */
.contact { display: grid; grid-template-columns: 1fr; gap: 2.2rem; align-items: center; }
@media (min-width: 860px) { .contact { grid-template-columns: 1.1fr 1fr; gap: 3rem; } }
.contact h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 800; margin-top: .7rem; }
.contact .sub { color: var(--muted); margin-top: 1.1rem; max-width: 40ch; }
.reach { display: grid; gap: 1.1rem; justify-items: start; min-width: 0; }
@media (min-width: 860px) { .reach { justify-items: end; text-align: right; } }
.mail { font-size: clamp(1.15rem, 3.4vw, 1.85rem); font-weight: 700; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; letter-spacing: -0.02em; }
.mail:hover { color: var(--accent-2); text-decoration: underline; text-underline-offset: 6px; }
.li { color: var(--coral); font-weight: 600; text-decoration: none; }
.li:hover { text-decoration: underline; text-underline-offset: 4px; }
.li:not([href]) { opacity: .55; }
footer { border-top: 1px solid var(--line); padding-block: 2rem 3rem; color: var(--muted); font-size: .88rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

.top {
  position: fixed; right: 1rem; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); width: 2.8rem; height: 2.8rem; border-radius: 50%;
  border: 1px solid var(--surface-3); background: var(--surface-2); color: var(--accent); font-size: 1.15rem; cursor: pointer; z-index: 75;
  opacity: 0; pointer-events: none; transition: opacity .25s, border-color .2s;
}
.top.show { opacity: 1; pointer-events: auto; }
.top:hover { border-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(1.4rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; background: var(--surface-3); color: var(--fg); border: 1px solid var(--line); padding: .6rem 1.1rem; border-radius: 99px; font-size: .88rem; font-weight: 600; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); z-index: 90; }
.toast::before { content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--green); margin-right: .55rem; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* load-in only (no scroll-triggered effects) */
.hero .rise { opacity: 0; transform: translateY(14px); animation: rise .6s var(--ease) forwards; }
.hero .d1 { animation-delay: .05s; } .hero .d2 { animation-delay: .12s; } .hero .d3 { animation-delay: .2s; } .hero .d4 { animation-delay: .28s; } .hero .d5 { animation-delay: .36s; }
@keyframes rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .hero .rise { opacity: 1; transform: none; }
}
</style>

  <div class="nav-in">
    <a class="brand" href="#top" id="brand">M.S<span>.</span></a>

</header>

<main id="top">
  <section class="hero" id="hero" aria-label="Introduction">

    <div class="wrap hero-grid">
      <div class="avatar rise d1"><img id="avatarImg" alt="Portrait of Madhura MS"></div>
      <div>
        <p class="eyebrow rise d2" id="headline"></p>
        <h1 class="rise d2" id="heroName"></h1>
        <p class="quote rise d3" id="quote"></p>
        <div class="cta rise d4"><a class="btn primary" href="#projects">View projects <span>&#8599;</span></a><a class="btn" href="#contact">Contact <span>&#8599;</span></a></div>
        <div class="socials rise d5" id="heroSocials"></div>
      </div>
    </div>
  </section>
  <div id="sections"></div>
</main>
<div class="wrap"><footer><span id="footName"></span><span>Code. Learn. Build.</span></footer></div>

/* ============================================================================================ */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const href = u => u ? ` href="${esc(u)}" target="_blank" rel="noopener"` : ` title="Link coming soon"`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const ICON = {
  github: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>'
};

/* menu: listed in the same order the sections appear */
const nav = [["about", "About"], ["skills", "Skills"], ["projects", "Projects"], ["experience", "Experience"], ["education", "Education"], ["achievements", "Achievements"], ["contact", "Contact"]];
$("#navLinks").innerHTML = nav.map(([id, l]) => `<a href="#${id}" data-id="${id}">${l}</a>`).join("");
$("#brand").innerHTML = esc(DATA.initials) + "<span>.</span>";
$("#avatarImg").src = IMG.photo;
$("#headline").textContent = DATA.headline;
$("#heroName").textContent = DATA.heroName;
$("#quote").textContent = DATA.quote;
$("#footName").textContent = "© 2026 " + DATA.name;
$("#heroSocials").innerHTML =
  `<a class="ico"${href(DATA.github)} aria-label="GitHub">${ICON.github}</a>` +
  `<a class="ico" href="mailto:${esc(DATA.email)}" aria-label="Email">${ICON.mail}</a>` +
  `<a class="ico"${href(DATA.linkedin)} aria-label="LinkedIn">${ICON.linkedin}</a>`;

const band = (id, n, label, title, sub, inner) => `<section class="band" id="${id}"><div class="wrap">
  <div class="sec-head"><div><span class="eyebrow">${n} / ${label}</span><h2>${title}</h2></div>${sub ? `<p>${sub}</p>` : ""}</div>${inner}</div></section>`;
const chips = a => `<div class="chips">${a.map(c => `<span class="chip">${esc(c)}</span>`).join("")}</div>`;
const project = p => `<article class="card project">
  <div class="shot"><img src="${IMG[p.img]}" alt="${esc(p.title)} screenshot" loading="lazy"></div>
  <div class="p-body"><h3>${esc(p.title)}</h3>
  ${p.bullets ? `<ul>${p.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : `<p>${esc(p.text)}</p>`}
  <a class="p-link"${href(p.repo)}>${ICON.github}GitHub repository ↗</a>${chips(p.tech)}</div></article>`;

$("#sections").innerHTML =
  band("about", "01", "About me", "A little context.", "The short version of what I care about and how I work.",
    `<div class="about"><img class="photo" src="${IMG.photo}" alt="Portrait of ${esc(DATA.name)}"><p>${esc(DATA.about)}</p></div>`) +
  band("skills", "02", "Skills", "Tools I use.", "",
    `<div class="skills">${DATA.skills.map(([g, items]) => `<div class="card skill"><h3>${esc(g)}</h3>${chips(items)}</div>`).join("")}</div>`) +
  band("projects", "03", "Projects", "Projects", "A visual look at the work I have built and explored.",
    `<div class="projects">${DATA.projects.map(project).join("")}</div>`) +
  band("experience", "04", "Experience", "Where I have contributed.", "",
    `<div class="stack">${DATA.experience.map(e => `<div class="card exp"><div class="when">${esc(e.when)}</div><div><h3>${esc(e.title)}</h3><p class="org">${esc(e.org)}</p><ul>${e.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div></div>`).join("")}</div>`) +
  band("education", "05", "Education", "Academic background.", "",
    `<div class="cols">${DATA.education.map(e => `<div class="card edu"><span class="when">${esc(e.when)}</span><h3>${esc(e.title)}</h3><p>${esc(e.place)}</p><p>${esc(e.score)}</p></div>`).join("")}</div>`) +
  band("achievements", "06", "Achievements", "Highlights & achievements.", "",
    `<div class="cols">${DATA.achievements.map(a => `<div class="card ach"><div class="ach-top"><span class="when">${esc(a.year)}</span><span class="pill">${esc(a.rank)}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.type)}</p></div>`).join("")}</div>`) +
  `<section class="band" id="contact"><div class="wrap"><div class="contact"><div><span class="eyebrow">07 / Get in touch</span><h2>Let’s make something useful.</h2><p class="sub">Reach me through Gmail or connect with me on LinkedIn.</p></div>
  <div class="reach"><a class="mail" href="mailto:${esc(DATA.email)}">${esc(DATA.email)} ↗</a><button class="btn" type="button" id="copyMail">Copy email address</button><a class="li"${href(DATA.linkedin)}>LinkedIn profile ↗</a></div></div></div></section>`;

/* copy email (the mail icon and the button both copy, so it works even if no mail app opens) */
let tt;
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1900); };
const copyEmail = () => {
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($(".mail")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Press Ctrl or Cmd + C to copy"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(DATA.email).then(() => toast("Email copied"), fallback); else fallback();
};
$("#copyMail").addEventListener("click", copyEmail);
$("#heroSocials a[aria-label='Email']").addEventListener("click", copyEmail);

/* navigation: every #link scrolls to its section */
const navEl = $("#navLinks"), links = [...navEl.querySelectorAll("a")];
let lock = 0;
const setActive = id => {
  links.forEach(a => a.classList.toggle("on", a.dataset.id === id));
  const on = links.find(a => a.classList.contains("on"));
  /* only the menu row scrolls sideways on phones; the page itself is never moved from here */
  if (on && navEl.scrollWidth > navEl.clientWidth) navEl.scrollLeft = on.offsetLeft - (navEl.clientWidth - on.offsetWidth) / 2;
};
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']"); if (!a) return;
  const id = a.getAttribute("href").slice(1), t = document.getElementById(id); if (!t) return;
  e.preventDefault(); lock = Date.now() + 1000; setActive(id === "top" ? "" : id);
  const before = scrollY, header = $("header.nav").offsetHeight;
  const y = id === "top" ? 0 : t.getBoundingClientRect().top + scrollY - header + 1;
  scrollTo({ top: Math.max(0, y), behavior: reduce ? "auto" : "smooth" });
  setTimeout(() => { if (Math.abs(scrollY - before) < 2 && y > 8) t.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }, 250);
});
const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && Date.now() >= lock) setActive(e.target.id); }), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll(".band").forEach(s => spy.observe(s));

/* back-to-top button: toggled only when it crosses a threshold, so scrolling stays light */
const topBtn = $("#toTop");
let shown = false, ticking = false;
addEventListener("scroll", () => {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => { const s = scrollY > 700; if (s !== shown) { shown = s; topBtn.classList.toggle("show", s); } ticking = false; });
}, { passive: true });
topBtn.addEventListener("click", () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

/* pause the hero's slow background motion once it is off screen */
const heroEl = $("#hero");
new IntersectionObserver(es => heroEl.classList.toggle("paused", !es[0].isIntersecting)).observe(heroEl);
</script>
